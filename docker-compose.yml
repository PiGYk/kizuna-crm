services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-kizuna}
      POSTGRES_USER: ${DB_USER:-kizuna}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kizuna}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kizuna}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    image: kizuna-crm:latest
    restart: unless-stopped
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-3} --worker-class gthread --threads ${GUNICORN_THREADS:-4} --timeout 120 --max-requests 1000 --max-requests-jitter 50 --access-logfile - --error-logfile -"
    volumes:
      - .:/app
      - ./media:/app/media
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  celery:
    image: kizuna-crm:latest
    restart: unless-stopped
    command: celery -A config.celery worker -l info -Q default
    volumes:
      - .:/app
    env_file: .env
    depends_on:
      - redis
      - db

  celery-beat:
    image: kizuna-crm:latest
    restart: unless-stopped
    command: celery -A config.celery beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    env_file: .env
    depends_on:
      - redis
      - db

volumes:
  postgres_data:
