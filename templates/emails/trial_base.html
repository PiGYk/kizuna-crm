<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>{{ subject }}</title>
<style>
  @font-face{font-family:'Fixel Display';src:url('https://crm.kizuna.com.ua/static/fonts/fixel/FixelDisplay-SemiBold.woff2') format('woff2');font-weight:600;font-display:swap}
  @font-face{font-family:'Fixel Text';src:url('https://crm.kizuna.com.ua/static/fonts/fixel/FixelText-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
  @font-face{font-family:'Fixel Text';src:url('https://crm.kizuna.com.ua/static/fonts/fixel/FixelText-SemiBold.woff2') format('woff2');font-weight:600;font-display:swap}
  body{margin:0;padding:0;background:#0d0c0b}
  a{color:#DEAA01}
  .lnk:hover{opacity:.85}
  @media (max-width:620px){
    .wrap{width:100% !important}
    .pad{padding-left:24px !important;padding-right:24px !important}
    .h1{font-size:26px !important;line-height:32px !important}
  }
</style>
</head>
<body style="margin:0;padding:0;background:#0d0c0b;">
<span style="display:none;font-size:0;line-height:0;max-height:0;opacity:0;overflow:hidden">{{ preheader }}</span>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#0d0c0b;">
<tr><td align="center" style="padding:32px 12px;">

  <table role="presentation" class="wrap" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:600px;background:#12100F;border:1px solid #2b2723;border-radius:8px;">

    <!-- шапка -->
    <tr><td class="pad" style="padding:32px 40px 0 40px;">
      <img src="https://crm.kizuna.com.ua/static/img/logo-email-dark.png" width="180" alt="Kizuna CRM"
           style="display:block;border:0;width:180px;height:auto;">
    </td></tr>
    <tr><td class="pad" style="padding:24px 40px 0 40px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
        <td height="2" style="height:2px;line-height:2px;font-size:0;background:#DEAA01;width:48px;">&nbsp;</td>
        <td height="2" style="height:2px;line-height:2px;font-size:0;background:#2b2723;">&nbsp;</td>
      </tr></table>
    </td></tr>

    <!-- заголовок -->
    <tr><td class="pad" style="padding:32px 40px 0 40px;">
      <h1 class="h1" style="margin:0;font-family:'Fixel Display','Fixel',Georgia,system-ui,sans-serif;
          font-weight:600;font-size:30px;line-height:36px;letter-spacing:-0.3px;color:#FFF7F3;">{{ title }}</h1>
    </td></tr>

    <!-- тіло -->
    <tr><td class="pad" style="padding:16px 40px 0 40px;
        font-family:'Fixel Text','Fixel',system-ui,-apple-system,'Segoe UI',sans-serif;
        font-size:16px;line-height:26px;color:#e6ded6;">
      {{ body_html|safe }}
    </td></tr>

    <!-- кнопка -->
    {% if cta_url %}
    <tr><td class="pad" style="padding:32px 40px 0 40px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
        <td style="background:#DEAA01;border-radius:6px;">
          <a class="lnk" href="{{ cta_url }}"
             style="display:inline-block;padding:13px 26px;font-family:'Fixel Text','Fixel',system-ui,sans-serif;
                    font-size:15px;font-weight:600;line-height:20px;color:#12100F;text-decoration:none;">{{ cta_text }}</a>
        </td>
      </tr></table>
    </td></tr>
    {% endif %}

    <!-- підпис -->
    <tr><td class="pad" style="padding:32px 40px 0 40px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
        <td height="1" style="height:1px;line-height:1px;font-size:0;background:#2b2723;">&nbsp;</td>
      </tr></table>
    </td></tr>
    <tr><td class="pad" style="padding:20px 40px 0 40px;
        font-family:'Fixel Text','Fixel',system-ui,sans-serif;font-size:15px;line-height:22px;color:#e6ded6;">
      Олег<br>
      <span style="color:#8a8478;font-size:14px;">Kizuna CRM</span>
    </td></tr>

    <!-- футер -->
    <tr><td class="pad" style="padding:28px 40px 32px 40px;
        font-family:'Fixel Text','Fixel',system-ui,sans-serif;font-size:13px;line-height:20px;color:#6b6560;">
      Ви отримали цей лист, бо реєстрували клініку в Kizuna CRM.<br>
      <a href="https://crm.kizuna.com.ua" style="color:#8a6a0d;text-decoration:none;">crm.kizuna.com.ua</a>
    </td></tr>

  </table>

</td></tr>
</table>
</body>
</html>
