{% load static %}
<link rel="stylesheet" href="{% static 'css/chat.css' %}">
<div class="kzc" id="kzc" role="complementary" aria-label="Помічник Kizuna CRM">

  <button class="kzc-tab" id="kzc-tab" aria-label="Відкрити помічника" title="Помічник Kizuna — запитайте про систему">
    <svg class="kzc-tab-ico" width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <path d="M3.5 5.5A2 2 0 015.5 3.5h9a2 2 0 012 2v6a2 2 0 01-2 2H8l-3.5 3v-3h-1a2 2 0 01-2-2v-6z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    </svg>
    <span class="kzc-tab-txt">Помічник</span>
    <span class="kzc-tab-dot"></span>
  </button>

  <div class="kzc-panel" id="kzc-panel">
    <div class="kzc-head">
      <div class="kzc-head-icon">K</div>
      <div class="kzc-head-t">
        <div class="kzc-head-title">Помічник Kizuna</div>
        <div class="kzc-head-sub">Відповідає за Довідкою системи</div>
      </div>
      <button class="kzc-min" id="kzc-min" aria-label="Згорнути">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M5 10h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="kzc-body" id="kzc-body"></div>

    <div class="kzc-foot">
      <form class="kzc-form" id="kzc-form">
        <textarea class="kzc-input" id="kzc-input" rows="1" maxlength="600"
                  placeholder="Запитайте про систему…" aria-label="Ваше питання"></textarea>
        <button class="kzc-send" id="kzc-send" type="submit" aria-label="Надіслати">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M3 10l14-6-6 14-2-6-6-2z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
      </form>

      <form class="kzc-lead" id="kzc-lead" autocomplete="off">
        <input type="text" id="kzc-lead-name" placeholder="Ваше ім'я" maxlength="120">
        <input type="tel" id="kzc-lead-phone" placeholder="Телефон *" maxlength="20" required>
        <input type="email" id="kzc-lead-email" placeholder="Пошта (не обов'язково)" maxlength="254">
        <input type="text" class="kzc-hp" id="kzc-lead-site" tabindex="-1" aria-hidden="true" placeholder="Сайт">
        <div class="kzc-err" id="kzc-lead-err" hidden></div>
        <div class="kzc-lead-row">
          <button type="submit" class="kzc-lead-send">Надіслати</button>
          <button type="button" class="kzc-lead-cancel" id="kzc-lead-cancel">Назад</button>
        </div>
      </form>

      <div class="kzc-hint" id="kzc-hint">
        Не знайшли відповідь? <button type="button" id="kzc-lead-open">Лишити контакт</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var root=document.getElementById('kzc');
  var body=document.getElementById('kzc-body');
  var form=document.getElementById('kzc-form');
  var input=document.getElementById('kzc-input');
  var send=document.getElementById('kzc-send');
  var tab=document.getElementById('kzc-tab');
  var min=document.getElementById('kzc-min');
  var lead=document.getElementById('kzc-lead');
  var leadOpen=document.getElementById('kzc-lead-open');
  var leadCancel=document.getElementById('kzc-lead-cancel');
  var leadErr=document.getElementById('kzc-lead-err');
  var hint=document.getElementById('kzc-hint');
  if(!root||!body)return;

  var history=[];
  var busy=false;
  // Вибір «відкрито/згорнуто» памʼятаємо ОКРЕМО для вітрини й для Довідки:
  // інакше відкритий на лендінгу чат їде в статтю і закриває її зміст.
  var STORE = location.pathname.indexOf('/help/')===0 ? 'kzc-collapsed-help' : 'kzc-collapsed-land';

  function collapsed(v){
    if(v===undefined)return root.classList.contains('is-collapsed');
    root.classList.toggle('is-collapsed',v);
    try{localStorage.setItem(STORE,v?'1':'0');}catch(e){}
  }
  // Стартовий стан: на лендінгу — відкрите вікно, на сторінках Довідки й на
  // вузьких екранах — згорнута плашка (щоб не закривати текст статті).
  // Перераховуємо на зміну ширини, поки людина сама не згорнула/розгорнула.
  var chosen=false;
  try{chosen=localStorage.getItem(STORE)!==null;}catch(e){}
  var isHelp=location.pathname.indexOf('/help/')===0;

  function autoState(){
    if(chosen)return;
    var narrow=window.matchMedia('(max-width:820px)').matches;
    root.classList.toggle('is-collapsed', narrow||isHelp);
  }
  if(chosen){
    var saved='0';
    try{saved=localStorage.getItem(STORE);}catch(e){}
    root.classList.toggle('is-collapsed',saved==='1');
  }else{
    autoState();
  }
  window.addEventListener('resize',autoState);

  tab.addEventListener('click',function(){chosen=true;collapsed(false);input.focus();});
  min.addEventListener('click',function(){chosen=true;collapsed(true);});

  function el(cls,text){var d=document.createElement('div');d.className=cls;if(text!==undefined)d.textContent=text;return d;}
  function scroll(){body.scrollTop=body.scrollHeight;}

  function addBot(text){body.appendChild(el('kzc-msg kzc-msg-bot',text));scroll();}
  function addMe(text){body.appendChild(el('kzc-msg kzc-msg-me',text));scroll();}
  function addSources(list){
    if(!list||!list.length)return;
    var wrap=el('kzc-src');
    list.slice(0,3).forEach(function(s){
      var a=document.createElement('a');
      a.href=s.url;a.textContent=s.title;a.target='_blank';a.rel='noopener';
      wrap.appendChild(a);
    });
    body.appendChild(wrap);scroll();
  }
  function addChips(items){
    var wrap=el('kzc-chips');
    items.forEach(function(t){
      var b=document.createElement('button');
      b.type='button';b.textContent=t;
      b.addEventListener('click',function(){wrap.remove();ask(t);});
      wrap.appendChild(b);
    });
    body.appendChild(wrap);scroll();
  }
  function typing(on){
    var old=document.getElementById('kzc-typing');
    if(old)old.remove();
    if(!on)return;
    var d=el('kzc-typing');d.id='kzc-typing';
    d.innerHTML='<span></span><span></span><span></span>';
    body.appendChild(d);scroll();
  }

  function ask(text){
    if(busy||!text)return;
    busy=true;send.disabled=true;
    addMe(text);
    history.push({role:'user',text:text});
    typing(true);
    fetch('/help/chat/',{
      method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({message:text,history:history.slice(0,-1)})
    }).then(function(r){return r.json();}).then(function(d){
      typing(false);
      var reply=d.reply||'Не вдалось відповісти. Спробуйте ще раз.';
      addBot(reply);
      addSources(d.sources);
      history.push({role:'assistant',text:reply});
      if(d.offer_lead)showLead();
    }).catch(function(){
      typing(false);
      addBot('Зв\'язок перервався. Спробуйте ще раз за хвилину.');
    }).then(function(){busy=false;send.disabled=false;});
  }

  form.addEventListener('submit',function(e){
    e.preventDefault();
    var text=input.value.trim();
    if(!text)return;
    input.value='';input.style.height='auto';
    ask(text);
  });
  input.addEventListener('input',function(){
    input.style.height='auto';
    input.style.height=Math.min(input.scrollHeight,96)+'px';
  });
  input.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.dispatchEvent(new Event('submit'));}
  });

  function showLead(){lead.classList.add('is-open');form.style.display='none';hint.style.display='none';}
  function hideLead(){lead.classList.remove('is-open');form.style.display='flex';hint.style.display='block';}
  leadOpen.addEventListener('click',showLead);
  leadCancel.addEventListener('click',hideLead);

  lead.addEventListener('submit',function(e){
    e.preventDefault();
    var phone=document.getElementById('kzc-lead-phone').value.trim();
    leadErr.hidden=true;
    if(phone.replace(/\D/g,'').length<9){
      leadErr.textContent='Вкажіть, будь ласка, телефон.';leadErr.hidden=false;return;
    }
    var p=new URLSearchParams(location.search);
    fetch('/help/chat/lead/',{
      method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({
        name:document.getElementById('kzc-lead-name').value.trim(),
        phone:phone,
        email:document.getElementById('kzc-lead-email').value.trim(),
        website:document.getElementById('kzc-lead-site').value.trim(),
        history:history,
        referer:document.referrer||'',
        utm_source:p.get('utm_source')||'',
        utm_medium:p.get('utm_medium')||'',
        utm_campaign:p.get('utm_campaign')||''
      })
    }).then(function(r){return r.json();}).then(function(d){
      if(d.ok){
        hideLead();
        addBot('Дякую! Записав ваш контакт — Олег звʼяжеться з вами найближчим часом.');
      }else{
        leadErr.textContent=d.error||'Не вдалось надіслати. Спробуйте ще раз.';leadErr.hidden=false;
      }
    }).catch(function(){
      leadErr.textContent='Не вдалось надіслати. Спробуйте ще раз.';leadErr.hidden=false;
    });
  });

  addBot('Вітаю! Я помічник по Kizuna CRM. Запитуйте — розкажу, як система веде клієнтів і пацієнтів, касу, склад, чеки й записи на прийом.');
  addChips(['Скільки коштує?','Що вміє система?','Чи є фіскальний чек?','Як почати роботу?']);
})();
</script>
