<div id="quick-visit-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
  <div class="bg-white rounded-xl p-6 max-w-md w-full shadow-xl">
    <h2 class="text-lg font-bold text-brand-dark mb-4">⚡ Швидкий візит — {{ patient.name }}</h2>
    <form method="post" action="{% url 'clients:quick_visit' patient.pk %}">
      {% csrf_token %}
      <div class="space-y-3">
        <div>
          <label class="text-xs text-gray-500 block mb-1">Скарги / причина</label>
          <input type="text" name="complaint" value="Плановий огляд" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-gold">
        </div>
        <div>
          <label class="text-xs text-gray-500 block mb-1">Діагноз</label>
          <input type="text" name="diagnosis" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-gold">
        </div>
        <div>
          <label class="text-xs text-gray-500 block mb-1">Лікування</label>
          <textarea name="treatment" rows="2" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-gold"></textarea>
        </div>
      </div>
      <div class="flex gap-3 mt-5">
        <button type="submit" class="flex-1 bg-brand-gold text-brand-dark py-2.5 rounded-lg text-sm font-semibold hover:brightness-95 transition">Записати</button>
        <button type="button" onclick="this.closest('#quick-visit-modal').classList.add('hidden')" class="flex-1 border border-gray-200 text-gray-500 py-2.5 rounded-lg text-sm hover:bg-gray-50 transition">Скасувати</button>
      </div>
    </form>
  </div>
</div>
