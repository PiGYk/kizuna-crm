{# Crop modals (analysis + photo) + supporting JS. Потребує CropperJS глобально. #}

{# ── Analysis crop modal ──────────────────────────────────────────────────── #}
<div id="analysis-crop-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
  <div class="bg-white rounded-xl shadow-xl max-w-lg w-full max-h-[85vh] overflow-y-auto p-4">
    <div class="flex items-center justify-between mb-3">
      <h3 class="font-semibold text-brand-dark">Обрізка фото</h3>
      <button type="button" onclick="closeAnalysisCrop()" aria-label="Закрити"
        class="w-11 h-11 -m-2 flex items-center justify-center text-gray-400 hover:text-gray-600">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="relative w-full" style="max-height:60vh; overflow:hidden;">
      <img id="analysis-crop-image" class="w-full" style="max-height:55vh;">
    </div>
    <div class="flex items-center flex-wrap gap-2 mt-3">
      <button type="button" onclick="_aCropper&&_aCropper.setAspectRatio(NaN)" class="px-3 min-h-[44px] text-sm rounded border border-gray-300 hover:border-brand-gold">Вільно</button>
      <button type="button" onclick="_aCropper&&_aCropper.setAspectRatio(1)" class="px-3 min-h-[44px] text-sm rounded border border-gray-300 hover:border-brand-gold">1:1</button>
      <button type="button" onclick="_aCropper&&_aCropper.setAspectRatio(4/3)" class="px-3 min-h-[44px] text-sm rounded border border-gray-300 hover:border-brand-gold">4:3</button>
      <button type="button" onclick="_aCropper&&_aCropper.setAspectRatio(3/4)" class="px-3 min-h-[44px] text-sm rounded border border-gray-300 hover:border-brand-gold">3:4</button>
    </div>
    <div class="flex gap-2 mt-3">
      <button type="button" onclick="applyAnalysisCrop()"
        class="flex-1 min-h-[44px] bg-brand-gold text-brand-dark py-2 rounded-lg text-sm font-semibold hover:brightness-95">
        Застосувати
      </button>
      <button type="button" onclick="closeAnalysisCrop()"
        class="px-4 min-h-[44px] border border-gray-300 text-gray-600 rounded-lg text-sm hover:bg-gray-50">
        Скасувати
      </button>
    </div>
  </div>
</div>

{# ── Photo crop modal ─────────────────────────────────────────────────────── #}
<div id="photo-crop-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
  <div class="bg-white rounded-xl p-5 max-w-lg w-full max-h-[85vh] overflow-y-auto shadow-xl">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-lg font-bold text-brand-dark">Обрізати фото</h2>
      <button type="button" onclick="closePhotoCropModal()" aria-label="Закрити"
        class="w-11 h-11 -m-2 flex items-center justify-center text-gray-400 hover:text-gray-600">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="mb-3" style="max-height:55vh; overflow:hidden;">
      <img id="photo-crop-image" class="w-full" style="max-height:55vh;">
    </div>
    <div class="flex items-center justify-center gap-2 mb-3">
      <button type="button" onclick="photoZoom(-0.1)" aria-label="Зменшити"
        class="w-11 h-11 flex items-center justify-center rounded-lg border border-gray-200 text-gray-500 hover:border-brand-gold">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"/></svg>
      </button>
      <button type="button" onclick="photoZoom(0.1)" aria-label="Збільшити"
        class="w-11 h-11 flex items-center justify-center rounded-lg border border-gray-200 text-gray-500 hover:border-brand-gold">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
      </button>
    </div>
    <div class="flex gap-3">
      <button type="button" onclick="applyPhotoCrop()"
        class="flex-1 min-h-[44px] bg-brand-gold text-brand-dark py-2.5 rounded-lg text-sm font-semibold hover:brightness-95 transition">
        Зберегти
      </button>
      <button type="button" onclick="closePhotoCropModal()"
        class="flex-1 min-h-[44px] border border-gray-200 text-gray-500 py-2.5 rounded-lg text-sm hover:bg-gray-50 transition">
        Скасувати
      </button>
    </div>
  </div>
</div>

<script>
// ── Analysis crop ───────────────────────────────────────────────────────────
let _aCropper = null;
let _aCropFile = null;

function openAnalysisCrop(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  _aCropFile = file;
  const reader = new FileReader();
  reader.onload = e => {
    const img = document.getElementById('analysis-crop-image');
    img.src = e.target.result;
    document.getElementById('analysis-crop-modal').classList.remove('hidden');
    if (_aCropper) _aCropper.destroy();
    img.onload = () => {
      _aCropper = new Cropper(img, {
        viewMode: 1,
        autoCropArea: 0.95,
        responsive: true,
        background: false,
      });
    };
  };
  reader.readAsDataURL(file);
}

function closeAnalysisCrop() {
  document.getElementById('analysis-crop-modal').classList.add('hidden');
  if (_aCropper) { _aCropper.destroy(); _aCropper = null; }
}

function applyAnalysisCrop() {
  if (!_aCropper) return;
  const canvas = _aCropper.getCroppedCanvas({ maxWidth: 2400, maxHeight: 2400 });
  canvas.toBlob(blob => {
    const dt = new DataTransfer();
    const name = _aCropFile ? _aCropFile.name : 'analysis.jpg';
    dt.items.add(new File([blob], name, { type: 'image/jpeg' }));
    document.getElementById('analysis-photo-hidden').files = dt.files;
    const preview = document.getElementById('analysis-crop-preview');
    const previewImg = document.getElementById('analysis-crop-preview-img');
    previewImg.src = canvas.toDataURL('image/jpeg', 0.9);
    preview.classList.remove('hidden');
    closeAnalysisCrop();
  }, 'image/jpeg', 0.92);
}

// ── Section toggles + compare ───────────────────────────────────────────────
function toggleSection(btn) {
  const content = btn.nextElementSibling;
  const arrow = btn.querySelector('.section-arrow');
  content.classList.toggle('hidden');
  arrow.classList.toggle('rotate-180');
}

function toggleCompare() {
  document.getElementById('compare-panel').classList.toggle('hidden');
}
function loadCompareImg(side) {
  const sel = document.getElementById('compare-' + side);
  const img = document.getElementById('compare-img-' + side);
  if (sel.value) { img.src = sel.value; img.style.display = ''; }
  else { img.style.display = 'none'; }
}

// ── Photo crop ──────────────────────────────────────────────────────────────
let _photoCropper = null;
let _photoFile = null;

// Default behaviour: якщо skip-crop увімкнено — постимо форму напряму (Pillow стиснее на бекенді).
function onPhotoPicked(input) {
  if (!input.files || !input.files[0]) return;
  const skip = document.getElementById('skip-crop');
  if (skip && skip.checked) {
    document.getElementById('photo-form').submit();
    return;
  }
  openPhotoCropModal(input);
}

function openPhotoCropModal(input) {
  if (!input.files || !input.files[0]) return;
  _photoFile = input.files[0];
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = document.getElementById('photo-crop-image');
    img.src = e.target.result;
    document.getElementById('photo-crop-modal').classList.remove('hidden');
    if (_photoCropper) _photoCropper.destroy();
    img.onload = function() {
      _photoCropper = new Cropper(img, {
        aspectRatio: 1,
        viewMode: 1,
        autoCropArea: 0.9,
        background: false,
      });
    };
  };
  reader.readAsDataURL(_photoFile);
}

function closePhotoCropModal() {
  document.getElementById('photo-crop-modal').classList.add('hidden');
  if (_photoCropper) { _photoCropper.destroy(); _photoCropper = null; }
}

function applyPhotoCrop() {
  if (!_photoCropper) return;
  const canvas = _photoCropper.getCroppedCanvas({ maxWidth: 1200, maxHeight: 1200 });
  canvas.toBlob(function(blob) {
    const name = _photoFile ? _photoFile.name : 'photo.jpg';
    const dt = new DataTransfer();
    dt.items.add(new File([blob], name, { type: 'image/jpeg' }));
    // Кладемо обрізаний blob у видимий input з name="photo"
    const picker = document.getElementById('photo-file-picker');
    picker.removeAttribute('onchange');
    picker.files = dt.files;
    document.getElementById('photo-form').submit();
  }, 'image/jpeg', 0.85);
}

function photoZoom(delta) {
  if (_photoCropper) _photoCropper.zoom(delta);
}
</script>
