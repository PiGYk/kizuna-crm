{% comment %}
Обгортка стрічки повідомлень (desktop). Рендериться ОДИН раз при відкритті чату.
Далі нові повідомлення дописуються в кінець (hx-swap=beforeend від #tg-poller),
а історія — вставляється зверху замість якоря. Повного ререндеру більше немає:
через нього кожні 5с пересоздавались <video>/<audio> і зривався скрол.
{% endcomment %}
<div id="messages-list"
     class="flex flex-col gap-2 p-4 overflow-y-auto flex-1"
     data-chat-id="{{ chat.pk }}">
  {% include 'tg/partials/history_top.html' %}
  {% include items_template %}
  {% if not messages %}
  <div class="text-center text-sm text-gray-400 py-12">
    Повідомлень ще немає.<br>Напишіть перше — або зачекайте, поки клієнт відповість боту.
  </div>
  {% endif %}
</div>
