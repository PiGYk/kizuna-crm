{% extends 'base.html' %}
{% block title %}Telegram — Kizuna CRM{% endblock %}
{% block content %}
<div class="mb-4 flex flex-col md:flex-row md:items-end md:justify-between gap-3 md:gap-4">
  <div class="min-w-0">
    <h1 class="text-2xl font-bold text-brand-dark">Telegram</h1>
    <p class="text-sm text-gray-400 mt-1">Оберіть чат або попросіть клієнта написати боту</p>
  </div>
  <div class="flex flex-col md:flex-row gap-2 md:gap-3 md:items-end w-full md:w-auto">
    <input type="search" id="chat-search-main" name="q"
           placeholder="Пошук за клієнтом або твариною…"
           autocomplete="off"
           hx-get="{% url 'tg:list_partial' %}"
           hx-trigger="input changed delay:300ms"
           hx-target="#chat-list-main"
           hx-swap="innerHTML"
           class="border border-gray-200 rounded-xl px-3 py-2 text-sm w-full md:w-64 focus:outline-none focus:ring-2 focus:ring-brand-gold order-2 md:order-1">
    <a href="{% url 'tg:broadcast_list' %}"
       class="px-4 py-2 rounded-lg text-sm font-medium border border-gray-200 text-gray-600 hover:border-brand-gold hover:text-brand-dark active:opacity-80 transition-all shrink-0 text-center order-1 md:order-2">
      Розсилки
    </a>
  </div>
</div>
<div class="bg-white rounded-xl border border-gray-200 overflow-hidden max-w-2xl">
  <div id="chat-list-main"
       hx-get="{% url 'tg:list_partial' %}"
       hx-trigger="load, every 10s [!document.hidden]"
       hx-include="#chat-search-main"
       hx-swap="innerHTML">
    <div class="p-8 text-center text-gray-400 text-sm">Завантаження…</div>
  </div>
</div>
{% endblock %}
