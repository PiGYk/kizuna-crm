<div id="quick-intake-modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-xl p-6 max-w-sm w-full shadow-xl">
    <h2 class="text-lg font-bold text-brand-dark mb-1">Прихід товару</h2>
    <p class="text-sm text-gray-500 mb-4">{{ product.name }} <span class="text-gray-400">(залишок: {{ product.quantity|floatformat:"-3" }} {{ product.unit.short|default:"" }})</span></p>

    <form method="post" action="{% url 'inventory:stock_in' product.pk %}">
      {% csrf_token %}
      <input type="hidden" name="next" value="{% url 'inventory:list' %}">
      <div class="grid grid-cols-2 gap-3 mb-4">
        <div>
          <label class="text-xs text-gray-500 block mb-1">Кількість *</label>
          <input type="number" name="quantity" min="0.001" step="any" required autofocus
            class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-gold">
        </div>
        <div>
          <label class="text-xs text-gray-500 block mb-1">Ціна закуп.</label>
          <input type="number" name="price" min="0" step="0.01" value="{{ product.buy_price }}"
            class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-gold">
        </div>
      </div>
      <div class="mb-4">
        <label class="text-xs text-gray-500 block mb-1">Примітка</label>
        <input type="text" name="reason" placeholder="Необов'язково"
          class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-gold">
      </div>
      <div class="flex gap-3">
        <button type="submit" class="flex-1 bg-brand-gold text-brand-dark py-2.5 rounded-lg text-sm font-semibold hover:brightness-95 transition">
          Записати
        </button>
        <button type="button" onclick="this.closest('#quick-intake-modal').remove()"
          class="flex-1 border border-gray-200 text-gray-500 py-2.5 rounded-lg text-sm hover:bg-gray-50 transition">
          Скасувати
        </button>
      </div>
    </form>
  </div>
</div>
