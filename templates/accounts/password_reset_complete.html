{% extends 'base.html' %}
{% load static %}

{% block title %}Пароль змінено — Kizuna CRM{% endblock %}

{% block auth_content %}
<div class="min-h-screen flex bg-brand-cream">

  <div class="hidden md:flex flex-col items-center justify-center w-1/2 bg-brand-dark">
    <img src="{% static 'img/logo.svg' %}" alt="Kizuna CRM" class="w-56 h-56 object-contain">
  </div>

  <div class="flex flex-col items-center justify-center w-full md:w-1/2 px-8">
    <div class="w-full max-w-sm text-center">
      <div class="flex justify-center mb-8 md:hidden">
        <img src="{% static 'img/logo.svg' %}" alt="Kizuna CRM" class="h-20 w-auto">
      </div>

      <div class="bg-green-50 border border-green-200 text-green-700 rounded-lg px-4 py-6 mb-6">
        <div class="text-3xl mb-2">✅</div>
        <h2 class="text-lg font-bold mb-2">Пароль оновлено</h2>
        <p class="text-sm">Тепер можете увійти за новим паролем.</p>
      </div>

      <a href="{% url 'accounts:login' %}"
        class="inline-block w-full bg-brand-gold text-brand-dark font-semibold py-2.5 rounded-lg text-sm hover:brightness-95 transition-all">
        Увійти
      </a>
    </div>
  </div>

</div>
{% endblock %}
