{% extends 'base.html' %}
{% block title %}Розрахувати зарплату — Kizuna CRM{% endblock %}

{% block content %}
<div class="max-w-lg">
  <div class="flex items-center gap-3 mb-6">
    <a href="{% url 'accounts:payroll_list' %}" class="text-gray-400 hover:text-gray-600">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
    </a>
    <h1 class="text-2xl font-bold text-gray-900">Розрахувати зарплату</h1>
  </div>

  <div class="bg-white rounded-xl border border-gray-200 p-6">
    <form method="post" class="space-y-5">
      {% csrf_token %}

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Дата від</label>
          <input type="date" name="period_start" value="{{ default_start|date:'Y-m-d' }}" required
            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-gold focus:border-transparent">
          <p class="text-xs text-gray-400 mt-1">Попередній місяць: {{ default_start|date:"d.m.Y" }}</p>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Дата до</label>
          <input type="date" name="period_end" value="{{ default_end|date:'Y-m-d' }}" required
            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-gold focus:border-transparent">
          <p class="text-xs text-gray-400 mt-1">{{ default_end|date:"d.m.Y" }}</p>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Працівники</label>
        <div class="space-y-2 max-h-60 overflow-y-auto border border-gray-200 rounded-lg p-3">
          {% for u in staff %}
          <label class="flex items-center gap-3 px-2 py-1.5 rounded-lg hover:bg-gray-50 cursor-pointer">
            <input type="checkbox" name="user_ids" value="{{ u.pk }}" checked
              class="w-4 h-4 rounded border-gray-300 text-brand-gold focus:ring-brand-gold">
            <div>
              <span class="text-sm font-medium text-brand-dark">{{ u.get_full_name|default:u.username }}</span>
              <span class="text-xs text-gray-400 ml-1">({{ u.get_role_display }})</span>
              {% if u.salary_type %}
              <span class="text-xs text-gray-400 ml-1">
                {% if u.salary_type == 'fixed' %}Фікс {{ u.salary_fixed }} ₴
                {% elif u.salary_type == 'percent' %}{{ u.salary_percent }}%
                {% elif u.salary_type == 'mixed' or u.salary_type == 'fixed_percent' %}Фікс {{ u.salary_fixed }} ₴ + {{ u.salary_percent }}%
                {% elif u.salary_type == 'hourly' %}{{ u.salary_hourly }} ₴/год
                {% endif %}
              </span>
              {% endif %}
            </div>
          </label>
          {% endfor %}
        </div>
      </div>

      <div class="flex gap-3 pt-2">
        <button type="submit"
          class="bg-brand-gold text-brand-dark px-6 py-2.5 rounded-lg text-sm font-semibold hover:brightness-95 transition-colors">
          Розрахувати
        </button>
        <a href="{% url 'accounts:payroll_list' %}"
          class="px-6 py-2.5 rounded-lg text-sm font-medium text-gray-700 border border-gray-300 hover:bg-gray-50 transition-colors">
          Скасувати
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
